name: Validate standalone notebook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_submission_notebook.py', 'submission/workflow.py', 'submission/data.json', 'notebooks/**', '.github/workflows/notebook-demo.yml']
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_submission_notebook.py
