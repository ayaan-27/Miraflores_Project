name: Publish month-end review
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute standalone notebook with no extra Python packages
        run: python scripts/build_submission_notebook.py
      - name: Install browser acceptance tools
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test offline file with no external asset requests
        run: python tests/submission_browser.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public prototype
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify_site.js
      - name: Exercise public prototype
        env:
          SUBMISSION_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tests/submission_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: month-end-review-validation
          path: artifacts/submission-*
          if-no-files-found: ignore
