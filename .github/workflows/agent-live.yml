name: Validate real no-key model workflow
on:
  workflow_dispatch:
  push:
    branches: [feat/agentic-invoice-investigator]
    paths:
      - 'agent_workspace/**'
      - 'agent_samples/**'
      - 'scripts/download_agent_model.py'
      - 'scripts/live_agent_smoke.py'
      - 'requirements-agent*.txt'
      - '.github/workflows/agent-live.yml'
concurrency:
  group: real-agent-model
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  local-model-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: '-DGGML_CUDA=OFF -DGGML_NATIVE=OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-agent*.txt
      - name: Install pinned CPU inference and framework dependencies
        run: pip install -r requirements-agent.txt
      - uses: actions/cache@v4
        with:
          path: .agent-data/models
          key: qwen2.5-1.5b-instruct-official-q8-v1
      - name: Download and SHA-256 verify official open weights
        run: python scripts/download_agent_model.py
      - name: Execute actual model, tools, financial controls, and evidence-resume loop
        run: python scripts/run_live_agent_check.py
      - name: Retain real-run evidence (no model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-agent-validation
          path: artifacts/live-agent/
          if-no-files-found: ignore
