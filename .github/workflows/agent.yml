name: Validate invoice investigation workflow
on:
  push:
    branches: [feat/agentic-invoice-investigator]
  pull_request:
permissions:
  contents: read
jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-agent-dev.txt
      - name: Framework, tool, control, checkpoint, and API tests (model test doubles)
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: node --check agent_workspace/web/workspace.js
